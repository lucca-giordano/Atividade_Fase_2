<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <line x1="0" y1="0" x2="300" y2="0" fill="none" stroke="gray" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="200" fill="none" stroke="gray" stroke-width="2"/>
  <g transform="translate(80 60) rotate(30)">
    <rect x="0" y="0" width="50" height="50" fill="blue" stroke="black" stroke-width="1"/>
  </g>
  <g transform="rotate(30) translate(80 60)">
    <rect x="0" y="0" width="50" height="50" fill="red" stroke="black" stroke-width="1"/>
  </g>
</svg>
